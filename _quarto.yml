project:
  type: default
  output-dir: _site
  render:
    - index.qmd
  resources:
    - figures/out/
    - figures/static/

format:
  revealjs:
    theme: [default, style.scss]
    slide-number: c/t
    width: 1600
    height: 900
    margin: 0.06
    html-math-method: katex
    code-line-numbers: false
    hash-type: number
    transition: none
    preview-links: false
    chalkboard: false
    pdf-separate-fragments: false
    include-in-header:
      text: |
        <style>
          .reveal-viewport {
            background-image: url("figures/out/background.svg");
            background-size: cover;
            background-position: bottom right;
            background-repeat: no-repeat;
          }
        </style>
